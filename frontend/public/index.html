<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo List</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>📋 مهامي</h1>
      <button id="theme-toggle" class="icon-btn" title="تبديل الوضع الليلي">🌙</button>
    </header>

    <section class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">الكل</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-pending">0</span>
        <span class="stat-label">متبقي</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-done">0</span>
        <span class="stat-label">منجز</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span id="progress-text">0%</span>
      </div>
    </section>

    <form id="todo-form" class="todo-form">
      <input type="text" id="input-title" placeholder="عنوان المهمة..." required />
      <textarea id="input-description" placeholder="وصف (اختياري)" rows="1"></textarea>
      <div class="form-row">
        <select id="input-priority">
          <option value="low">🟢 منخفضة</option>
          <option value="medium" selected>🟡 متوسطة</option>
          <option value="high">🔴 عالية</option>
        </select>
        <input type="date" id="input-dueDate" />
        <input type="text" id="input-category" placeholder="تصنيف (عام)" list="category-list" />
        <datalist id="category-list"></datalist>
        <button type="submit">إضافة</button>
      </div>
    </form>

    <section class="filters">
      <input type="text" id="search-input" placeholder="🔍 بحث بالعنوان أو الوصف..." />
      <select id="filter-priority">
        <option value="">كل الأولويات</option>
        <option value="high">عالية</option>
        <option value="medium">متوسطة</option>
        <option value="low">منخفضة</option>
      </select>
      <select id="filter-category">
        <option value="">كل التصنيفات</option>
      </select>
      <label class="checkbox-label">
        <input type="checkbox" id="filter-hide-completed" />
        إخفاء المنجز
      </label>
    </section>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-state" class="empty-state" hidden>لا توجد مهام مطابقة 🤷‍♂️</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
