<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دفتر المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="ledger-app">

    <header class="masthead">
      <div class="masthead-title">
        <span class="masthead-mark">§</span>
        <h1>دفتر المهام</h1>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="تبديل الوضع الليلي">◐</button>
    </header>

    <div class="layout">

      <!-- العمود الجانبي: دفتر الإحصائيات -->
      <aside class="ledger-panel">
        <div class="ledger-block">
          <span class="ledger-label">الحصيلة</span>
          <div class="tally-row">
            <div class="tally">
              <span class="tally-num" id="stat-total">0</span>
              <span class="tally-word">الكل</span>
            </div>
            <div class="tally">
              <span class="tally-num" id="stat-pending">0</span>
              <span class="tally-word">متبقي</span>
            </div>
            <div class="tally">
              <span class="tally-num" id="stat-done">0</span>
              <span class="tally-word">منجز</span>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="progress-caption" id="progress-text">0% مكتمل</span>
        </div>

        <div class="ledger-block">
          <span class="ledger-label">تصفية</span>
          <input type="text" id="search-input" class="ledger-input" placeholder="بحث..." />
          <select id="filter-priority" class="ledger-input">
            <option value="">كل الأولويات</option>
            <option value="high">عالية</option>
            <option value="medium">متوسطة</option>
            <option value="low">منخفضة</option>
          </select>
          <select id="filter-category" class="ledger-input">
            <option value="">كل التصنيفات</option>
          </select>
          <label class="ledger-checkbox">
            <input type="checkbox" id="filter-hide-completed" />
            إخفاء المنجز
          </label>
        </div>
      </aside>

      <!-- العمود الرئيسي -->
      <main class="main-col">

        <form id="todo-form" class="entry-card">
          <input type="text" id="input-title" class="entry-title-input" placeholder="عنوان مهمة جديدة..." required />
          <textarea id="input-description" class="entry-desc-input" placeholder="وصف (اختياري)" rows="1"></textarea>
          <div class="entry-row">
            <select id="input-priority">
              <option value="low">منخفضة</option>
              <option value="medium" selected>متوسطة</option>
              <option value="high">عالية</option>
            </select>
            <input type="date" id="input-dueDate" />
            <input type="text" id="input-category" placeholder="تصنيف" list="category-list" />
            <datalist id="category-list"></datalist>
            <button type="submit" class="entry-submit">إضافة +</button>
          </div>
        </form>

        <ul id="todo-list" class="index-list"></ul>
        <p id="empty-state" class="empty-note" hidden>لا توجد مهام مطابقة — الصفحة فاضية بانتظارك.</p>

      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
