<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <h1>دفتر المهام</h1>
      <p>نظّم يومك، رتّب أولوياتك، وخلّي كل مهمة تحت السيطرة — بمكان واحد بسيط وسريع.</p>
    </div>
    <div class="auth-form-side">
      <div class="auth-card">
        <h2>تسجيل الدخول</h2>
        <p class="sub">أهلاً فيك من جديد 👋</p>
        <div id="alert-box"></div>
        <form id="login-form">
          <div class="field">
            <label>الإيميل</label>
            <input type="email" id="login-email" required />
          </div>
          <div class="field">
            <label>كلمة السر</label>
            <input type="password" id="login-password" required />
          </div>
          <button type="submit" class="btn-primary" id="login-btn">دخول</button>
        </form>
        <p class="auth-alt">ما عندك حساب؟ <a href="register.html">أنشئ حساب جديد</a></p>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
